apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
      - name: scaletestapp
        image: ghcr.io/yandex-practicum/scaletestapp:latest
        resources:
          limits:
            memory: "30Mi"
            cpu: "200m"
          requests:
            memory: "20Mi"
            cpu: "100m"
        ports:
            - containerPort: 8080
        readinessProbe:
            httpGet:
                path: /
                port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10